<h1 id="projecting-the-real-solution">Projecting the Real Solution</h1>
<p>The real part is just the projection of the complex solution onto the real axis. Just how far along the real axis is the solution at any given time.</p>
<p>That looks like a time trace, but not quite, it's the real projection. The colors scheme is the same as before.</p>
</section>
