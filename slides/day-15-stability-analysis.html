<p>Particle bounces back and forth between the walls of the well with constant speed.</p>
<h3 id="quantum-motion-in-an-infinite-potential-well">Quantum Motion in an Infinite Potential Well</h3>
<p>Particle has quantized energy levels and corresponding wavefunctions that are sinusoidal within the well and zero outside the well.</p>
