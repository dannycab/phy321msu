<h2 id="goals-for-this-week">Goals for this week</h2>

<ul>
<li data-marpit-fragment="1">Establish a model for drag forces</li>
<li data-marpit-fragment="2">Develop an understanding of the process for modeling forces</li>
<li data-marpit-fragment="3">Produce equations of motion that can be investigated</li>
<li data-marpit-fragment="4">Start probing the behavior of these systems with math and computing</li>
</ul>
</section>

<h2 id="our-current-investigatory-process">Our Current Investigatory Process</h2>
<h3 id="the-model-to-trajectory-pipeline">The Model-to-Trajectory Pipeline</h3>
<ol>
<li>Model the forces acting on the system</li>
<li>Write the equations of motion using Newton's 2nd Law</li>
<li>Solve the equations of motion to find trajectories</li>
</ol>
<p>This is incomplete. We will need to learn how stability, critical points, and phase space can help us understand the behavior of these systems.</p>
<p>We have also only done step 3 analytically. We will need to learn how to use computing to investigate these systems.</p>
</section>

<h2 id="clicker-question-9-1">Clicker Question 9-1</h2>

<ol>
<li>A person swimming through water at moderate speed.</li>
<li>A small bacterium swimming through water at low speed.</li>
<li>A large airplane flying through the air at high speed.</li>
</ol>
<p><strong>Order these scenarios from lowest to highest Reynolds number.</strong></p>
