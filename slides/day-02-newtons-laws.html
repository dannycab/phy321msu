<h1 id="classical-mechanics">Classical Mechanics</h1>
<h2 id="modeling-large-slow-moving-objects">Modeling large, slow-moving objects</h2>

<ul>
<li data-marpit-fragment="1">Lagrangian Mechanics</li>
<li data-marpit-fragment="2">Hamiltonian Mechanics</li>
<li data-marpit-fragment="3">Dynamical Systems Theory</li>

</ul>

<h3 id="classical-mechanics-has-a-long-history">Classical Mechanics has a long history</h3>
<blockquote>
<p>Wherever folks were figuring out their world, there was classical mechanics</p>
</blockquote>
<ul>
<li><a href="https://www.science.org/doi/10.1126/science.200.4343.766">Astronomical analyses in Sub-Saharan Africa</a> in 300 BCE</li>
<li><a href="https://en.wikipedia.org/wiki/Science_and_technology_of_the_Song_dynasty">Scientific expansion in China</a> during the Song dynasty</li>
<li><a href="https://en.wikipedia.org/wiki/Islamic_Golden_Age">The Islamic Golden Age</a></li>
<li><a href="https://en.wikipedia.org/wiki/Indigenous_astronomy">Indigenous astronomy</a></li>
